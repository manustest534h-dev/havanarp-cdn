# HavanaRP: when a launcher release (tag v<versionCode>, asset HavanaRp.apk) is published,
# point api/runtime/config.json at it -> every launcher shows the update screen.
name: launcher-sync
on:
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: launcher-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            .github
            api/runtime
      - name: sync config.json with the newest launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_config.py
      - name: commit
        run: |
          git config user.name "havanarp-bot"; git config user.email "havanarp-bot@users.noreply.github.com"
          git add api/runtime/config.json api/runtime/launcher.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "launcher update: config.json apk -> $(python3 -c "import json;print(json.load(open('api/runtime/config.json'))['apk']['version'])")"
          for i in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done; exit 1
